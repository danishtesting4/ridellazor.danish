<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>whoami</title>
<link rel="icon" href="pfp/avatar.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="term" id="term">
  <div class="term-bar">
    <span class="term-title">guest@site: ~</span>
    <div class="win-controls">
      <span class="win-btn" id="btnMin" title="Minimize">–</span>
      <span class="win-btn" id="btnMax" title="Maximize">▢</span>
      <span class="win-btn win-close" id="btnClose" title="Close">×</span>
    </div>
  </div>

  <div class="term-body" id="termBody">
    <div class="line prompt-line"><span class="prompt">$</span> whoami</div>

    <div class="identity" id="identity">
      <img class="pfp" id="pfp" src="" alt="profile picture">
      <div class="identity-text">
        <h1 id="name">—</h1>
        <p class="handle" id="handle"></p>
        <p class="desc" id="desc"></p>
      </div>
    </div>

    <div class="line prompt-line"><span class="prompt">$</span> ls ~/</div>
    <div class="line"><a class="nav-link" href="pages/">pages/</a></div>

    <div class="line prompt-line"><span class="prompt">$</span> ls links/</div>
    <ul class="links" id="links"></ul>

    <p class="hint">Type "help" to see available commands.</p>

    <div class="term-history" id="termHistory"></div>

    <div class="line prompt-line" id="inputLine">
      <span class="prompt">$</span>
      <span class="cwd" id="cwd">~</span>
      <input type="text" id="cmdInput" class="cmd-input" autocomplete="off" spellcheck="false" autocapitalize="off" autofocus>
    </div>
  </div>
</main>

<div class="desktop" id="desktop">
  <div class="desktop-icons" id="desktopIcons"></div>
  <button class="taskbar-item" id="restoreBtn">
    <span class="taskbar-dot"></span> guest@site: ~
  </button>
</div>

<script src="script.js"></script>
</body>
</html>
