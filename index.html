<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RidelL — ridellazor.danish</title>
<link rel="icon" href="pfp/avatar.jpg">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="topbar" id="topbar">
  <span class="topbar-indicator" id="topbarIndicator"></span>
  <a class="topbar-tab active" href="">Home</a>
  <a class="topbar-tab" href="pages/people.html">People</a>
  <a class="topbar-tab" href="pages/">Projects</a>
  <a class="topbar-tab" href="pages/community.html">Community</a>
  <a class="topbar-tab" href="https://github.com/RidelLazor" target="_blank" rel="noopener">GitHub</a>
</nav>

<script>
(function () {
  var bar = document.getElementById('topbar');
  var ind = document.getElementById('topbarIndicator');
  if (!bar || !ind) return;
  var tabs = Array.from(bar.querySelectorAll('.topbar-tab'));
  function move(el) { if (!el) return; var r = el.getBoundingClientRect(), br = bar.getBoundingClientRect(); ind.style.left = (r.left - br.left) + 'px'; ind.style.width = r.width + 'px'; }
  var active = bar.querySelector('.topbar-tab.active') || tabs[0];
  requestAnimationFrame(function () { move(active); });
  tabs.forEach(function (t) { t.addEventListener('mouseenter', function () { move(t); }); t.addEventListener('mouseleave', function () { move(bar.querySelector('.topbar-tab.active') || tabs[0]); }); });
  window.addEventListener('resize', function () { move(bar.querySelector('.topbar-tab.active') || tabs[0]); });
})();
</script>

<main class="page-content">
  <div class="container">

    <section class="hero">
      <img class="hero-pfp" id="pfp" src="" alt="profile picture">
      <div class="hero-text">
        <p class="hero-eyebrow">ridellazor.dpdns.org</p>
        <h1 class="hero-name" id="name">—</h1>
        <p class="hero-handle" id="handle"></p>
        <p class="hero-bio" id="desc"></p>
      </div>
    </section>

    <section class="block">
      <h2 class="block-title">Links</h2>
      <ul class="link-list" id="links"></ul>
    </section>

    <section class="block">
      <h2 class="block-title">Projects</h2>
      <p class="block-sub">Things people have sent in.</p>
      <a class="btn" href="pages/">Browse all projects →</a>
    </section>

    <section class="block">
      <h2 class="block-title">People</h2>
      <p class="block-sub">Everyone who has sent something in.</p>
      <a class="btn" href="pages/people.html">See all people →</a>
    </section>

  </div>
</main>

<footer class="footer">
  <div class="container footer-inner">
    <span>© RidelLazor</span>
    <span class="footer-mono">ridellazor.dpdns.org</span>
  </div>
</footer>

<script type="module" src="script.js"></script>
</body>
</html>
