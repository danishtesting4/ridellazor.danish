<script>
(function () {
  var bar = document.getElementById('topbar');
  var ind = document.getElementById('topbarIndicator');
  if (!bar || !ind) return;
  var tabs = Array.from(bar.querySelectorAll('.topbar-tab'));
  function move(el) { if (!el) return; var r = el.getBoundingClientRect(), br = bar.getBoundingClientRect(); ind.style.left = (r.left - br.left) + 'px'; ind.style.width = r.width + 'px'; }
  var active = bar.querySelector('.topbar-tab.active') || tabs[0];
  requestAnimationFrame(function () { move(active); });
  tabs.forEach(function (t) { t.addEventListener('mouseenter', function () { move(t); }); t.addEventListener('mouseleave', function () { move(bar.querySelector('.topbar-tab.active') || tabs[0]); }); });
  window.addEventListener('resize', function () { move(bar.querySelector('.topbar-tab.active') || tabs[0]); });
})();
</script>
